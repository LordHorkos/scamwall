# SPDX-License-Identifier: AGPL-3.0-only
#
# ScamWall quality gates.
#
# This workflow runs the same gates as scripts/check.sh. Where a gate cannot run
# in CI — anything needing the Docker daemon against a built ScamWall image — it
# is reported as BLOCKED by that script and the job fails, exactly as it does
# locally. A gate that could not run has proven nothing, and a green CI badge
# that quietly omits half the suite is worse than a red one.
#
# SECURITY POSTURE
#
#   * Every action is pinned to a commit SHA, not a tag. A tag is mutable: the
#     owner (or anyone who compromises the account) can repoint it at different
#     code, and a pinned tag would silently execute it.
#   * `permissions` is read-only at the top level and not widened anywhere. The
#     job needs to read the repository and nothing else.
#   * The trigger is `pull_request`, never `pull_request_target`.
#     `pull_request_target` runs the BASE repository's workflow with a
#     writable token and access to secrets, while checking out the FORK's
#     code — which hands any contributor who opens a pull request the ability
#     to run arbitrary code with those privileges. `pull_request` runs fork
#     contributions with no secrets and a read-only token, which is the point.
#   * No repository secret is referenced by this workflow at all, so there is
#     nothing for an untrusted contribution to exfiltrate.
#   * Tool versions are pinned and echoed into the run log, so a result can be
#     tied to the toolchain that produced it.

name: gates

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

# Read-only by default, and never widened below.
permissions:
  contents: read

# A superseded run proves nothing about the current head, so cancel it rather
# than paying for it.
concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a result is attributable to an exact tool set. Bumping a version
  # here is a deliberate change that invalidates prior evidence
  # (docs/REQUIREMENTS_MATRIX.md section 5).
  GO_VERSION: '1.26.8'
  STATICCHECK_VERSION: '2026.2.1'
  GOVULNCHECK_VERSION: 'v1.7.0'
  SHELLCHECK_VERSION: 'v0.11.0'
  GITLEAKS_VERSION: '8.30.0'

jobs:
  gates:
    name: quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out the repository
        # actions/checkout v5
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          # Full history: the independent secret scan inspects every commit,
          # not only the tip. A shallow clone would silently narrow it.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v6
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          url="https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL --retry 3 -o /tmp/shellcheck.tar.xz "$url"
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz "$url"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Install Go analysis tools
        run: |
          set -euo pipefail
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Record tool versions
        # Printed into the run log so any result recorded from this job can be
        # tied to the exact tools that produced it.
        run: |
          set -uo pipefail
          echo "commit:      ${{ github.sha }}"
          echo "runner:      $(lsb_release -ds 2>/dev/null || uname -a)"
          echo "go:          $(go version)"
          echo "staticcheck: $("$(go env GOPATH)/bin/staticcheck" -version)"
          echo "govulncheck: $("$(go env GOPATH)/bin/govulncheck" -version | tr '\n' ' ')"
          echo "shellcheck:  $(shellcheck --version | awk '/^version:/{print $2}')"
          echo "gitleaks:    $(gitleaks version)"
          echo "jq:          $(jq --version)"
          echo "docker:      $(docker --version 2>/dev/null || echo 'not available')"

          # Compose is the tool behind the `docker compose config` gate and behind the

          # runtime verifier's configuration resolution. It was not recorded until a

          # result could not be attributed without it: an assertion on the RESOLVED

          # configuration passed locally and failed here, on the same definition,

          # because the two versions render one field differently.

          echo "compose:     $(docker compose version 2>/dev/null || echo 'not available')"

      - name: Create disposable deployment fixtures
        # WHY THIS STEP EXISTS
        #
        # deploy/compose/compose.yaml binds a private CA and an application
        # password from paths that exist on the operator's host and cannot
        # exist on a fresh runner. Without them the runtime verification cannot
        # create a container, so the gate that checks the deployment's
        # hardening never runs at all.
        #
        # The alternative — exempting CI from that gate — would leave the same
        # `check.sh` reporting a green run on evidence it never gathered. A
        # fixture is acceptable; a skipped assertion is not. The runtime
        # checker enforces exactly the same properties here as it does on the
        # operator's host: same mount destinations, same read-only flags, same
        # exact-set assertion, same permission check on the password file.
        #
        # WHAT THESE FILES ARE NOT
        #
        #   * Not production material. Nothing is copied from anywhere; both
        #     files are generated here and deleted below.
        #   * Not a signing key. The CA fixture is a placeholder, deliberately
        #     NOT a certificate and NOT a key: the verification it participates
        #     in is a mount inspection, and the container is never started, so
        #     nothing parses it. Generating a real key pair would create a
        #     credential for no verification benefit.
        #   * Not in the build context. They live under RUNNER_TEMP, outside the
        #     repository, so `docker build` (context `../..`) cannot see them.
        #   * Not site configuration. The compose definition's site-specific
        #     paths come from environment overrides whose defaults are the
        #     operator's; nothing about this network is written anywhere.
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/scamwall-ci-fixtures"
          # 0700, and asserted rather than assumed: the runtime verifier checks
          # that the password file is not reachable by every account on the
          # host, and a private directory is what makes that true regardless of
          # the file's own mode.
          # The mode is set after creation, not with `mkdir -m`: with -p that
          # mode applies to the deepest component only, and any parent it
          # created would take the ambient umask instead.
          rm -rf -- "$dir"
          mkdir -p -- "$dir"
          chmod 700 -- "$dir"

          printf '%s\n' \
            'ScamWall CI fixture. This is NOT a certificate and NOT a key.' \
            'It exists so that the deployment has a bind source at the path a' \
            'private CA occupies in a real deployment. The container is never' \
            'started, so nothing reads or parses it.' > "$dir/pihole-ca.crt"
          chmod 600 -- "$dir/pihole-ca.crt"

          # A throwaway value, never printed, never compared, never used to
          # authenticate to anything. Phase 1 in CI does not start the
          # application; whether the container identity can READ this file is a
          # separate requirement and is not tested by this run.
          umask 077
          head -c 32 /dev/urandom | base64 > "$dir/pihole_app_password"
          chmod 600 -- "$dir/pihole_app_password"

          # Reported as metadata only. No content is echoed.
          ls -l -- "$dir"

      - name: Run the gate suite
        # scripts/check.sh is the single definition of what a gate run is. CI
        # does not maintain a second list that could drift from the local one.
        #
        # The hosted runner does have a Docker daemon, so the image build and
        # the runtime verification actually execute here — which is more than
        # the service account can do locally. On any runner without a daemon
        # those gates report BLOCKED, and BLOCKED fails the suite rather than
        # being skipped, so this job can never be read as having verified an
        # image it never built.
        env:
          # Bind SOURCES only. Every mount DESTINATION is fixed in
          # compose.yaml and is not overridable, so these redirect where a file
          # comes from and change nothing the verifier asserts about the
          # container.
          SCAMWALL_CA_FILE: ${{ runner.temp }}/scamwall-ci-fixtures/pihole-ca.crt
          SCAMWALL_SECRET_FILE: ${{ runner.temp }}/scamwall-ci-fixtures/pihole_app_password
          # Where a failing gate's complete SANITIZED capture is retained, so
          # the run log's inline view can be bounded without the omitted
          # material being lost. See scripts/gate-diagnostics.sh.
          SCAMWALL_GATE_DIAG_DIR: ${{ runner.temp }}/gate-diagnostics
        run: bash ./scripts/check.sh

      - name: Record the verified image identity
        # The container gates BUILD an image and verify it, and `check.sh`
        # prints a passing gate's output nowhere — so a green run said which
        # gates passed but not which artifact they passed against. An
        # image-bound requirement (SW-P1-05, SW-P1-20) needs the ID, and a run
        # that omits it is not evidence for those rows however green it is.
        #
        # `if: always()`, because the ID is just as interesting when the
        # verification failed. It cannot affect the job's conclusion: it runs
        # after the gate step, and `|| true` keeps a missing image (the build
        # itself failed) from adding a second, misleading failure.
        if: always()
        run: |
          set -uo pipefail
          echo "verified image: $(docker image inspect -f '{{.Id}}' scamwall:local 2>/dev/null || echo 'no scamwall:local image exists')"
          echo "source commit:  ${{ github.sha }}"

      - name: Upload gate diagnostics
        # Runs whatever the outcome, and cannot change it: the gate step above
        # has already concluded, and a step that only collects evidence must
        # never be able to turn a red job green.
        #
        # Everything here has been through scripts/gate-diagnostics.sh, which
        # redacts credential-shaped material and is self-tested against decoys
        # (scripts/tests/gate-diagnostics-test.sh). Nothing unsanitized is
        # written to this directory.
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gate-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove disposable fixtures
        # Unconditional, and independent of the gate result. The runner is
        # discarded after the job, but a fixture that outlives its step is a
        # fixture something else can pick up, and "the runner goes away" is not
        # a cleanup procedure.
        if: always()
        run: |
          set -uo pipefail
          dir="${RUNNER_TEMP}/scamwall-ci-fixtures"
          rm -rf -- "$dir"
          if [ -e "$dir" ]; then
            echo "::error::CI fixtures could not be removed: $dir"
            exit 1
          fi
          echo "CI fixtures removed."
